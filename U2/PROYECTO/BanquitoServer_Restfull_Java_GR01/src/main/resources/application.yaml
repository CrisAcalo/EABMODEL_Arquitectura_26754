spring:
  application:
    name: BanquitoServer_Restfull_Java_GR01

  # Conexión a MySQL Docker
  datasource:
    url: jdbc:mysql://localhost:3306/BanquitoDB?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Configuración de HikariCP
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        # Usar los nombres exactos de @Table y @Column (no convertir a snake_case)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Servidor
server:
  port: 8080

# Parámetros de crédito (equivalente a Web.config de .NET)
credito:
  tasa-anual: 0.16
  plazo-minimo: 3
  plazo-maximo: 24
  porcentaje-capacidad: 0.60
  multiplicador: 9

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
